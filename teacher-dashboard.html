<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  (function(){
    try {
      var t = localStorage.getItem("teacher_dashboard_theme_v1");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch(e) {}
  })();
</script>
<title>Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:[email protected]..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root {
    --paper: #f6f1ea;
    --paper-line: #e3dccf;
    --panel: #ffffff;
    --ink: #2a2724;
    --slate: #5c6570;
    --maroon: #822336;
    --maroon-dark: #5c1827;
    --accent-gray: #75787b;
    --danger: #9a4a3a;
    --success: #3a7a4a;
    --radius: 10px;
    --sans: "Google Sans Flex", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1d1a17;
      --paper-line: #38322b;
      --panel: #262220;
      --ink: #ece5d8;
      --slate: #a9b1b8;
      --maroon: #c4536b;
      --maroon-dark: #e07d91;
      --accent-gray: #b5b8ba;
      --danger: #d98b78;
      --success: #7fbf8f;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1d1a17;
    --paper-line: #38322b;
    --panel: #262220;
    --ink: #ece5d8;
    --slate: #a9b1b8;
    --maroon: #c4536b;
    --maroon-dark: #e07d91;
    --accent-gray: #b5b8ba;
    --danger: #d98b78;
    --success: #7fbf8f;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo-plate {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 5px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-plate svg { width: 100%; height: 100%; display: block; }
  header.top h1 { font-weight: 700; font-size: 1.5rem; margin: 0; }
  header.top .sub { font-size: 0.85rem; color: var(--slate); }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .sem-toggle {
    display: inline-flex;
    border: 1px solid var(--paper-line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--panel);
  }
  .sem-toggle button {
    border: none; background: transparent;
    padding: 7px 16px; font-family: var(--sans);
    font-size: 0.85rem; font-weight: 600; color: var(--slate); cursor: pointer;
  }
  .sem-toggle button.active { background: var(--maroon); color: #fff; }
  .theme-toggle {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--paper-line); background: var(--panel); color: var(--ink);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto;
  }
  .theme-toggle:hover { border-color: var(--maroon); color: var(--maroon); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
  }
  .btn {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--paper-line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .btn.ghost { color: var(--slate); }
  .search-input {
    flex: 1 1 180px;
    min-width: 140px;
    padding: 9px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 0.85rem;
  }
  .stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--paper-line);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .stat-card .num { font-size: 1.5rem; font-weight: 700; }
  .stat-card .label { font-size: 0.75rem; color: var(--slate); margin-top: 2px; }
  .stat-card.danger .num { color: var(--danger); }
  .stat-card.success .num { color: var(--success); }

  .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--paper-line);
    background: var(--panel);
    color: var(--slate);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-family: var(--sans);
    font-weight: 600;
    cursor: pointer;
  }
  .chip.active { background: var(--maroon); border-color: var(--maroon); color: #fff; }

  .empty-state {
    background: var(--panel);
    border: 1px dashed var(--paper-line);
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    color: var(--slate);
  }
  .empty-state .btn { margin-top: 14px; }

  .roster {
    background: var(--panel);
    border: 1px solid var(--paper-line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .roster-head, .roster-row {
    display: grid;
    grid-template-columns: 1.7fr repeat(6, 0.65fr) 0.7fr 0.55fr 28px;
    align-items: center;
    padding: 10px 14px;
    gap: 6px;
  }
  .roster-head {
    font-size: 0.7rem;
    color: var(--slate);
    font-weight: 600;
    border-bottom: 1px solid var(--paper-line);
  }
  .roster-row {
    font-size: 0.85rem;
    border-bottom: 1px solid var(--paper-line);
    cursor: pointer;
  }
  .roster-row:last-child { border-bottom: none; }
  .roster-row:hover { background: var(--paper); }
  .roster-row .rname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grade-f { color: var(--danger); font-weight: 700; }
  .grade-ie { color: var(--accent-gray); }
  .grade-none { color: var(--paper-line); }
  .trend-up { color: var(--success); font-weight: 700; }
  .trend-down { color: var(--danger); font-weight: 700; }
  .trend-flat { color: var(--slate); }
  .remove-student {
    border: none; background: none; color: var(--slate);
    cursor: pointer; font-size: 0.85rem; justify-self: end;
  }
  .remove-student:hover { color: var(--danger); }

  .detail-panel {
    background: var(--paper);
    border-top: 1px solid var(--paper-line);
    padding: 16px 20px 20px;
  }
  .detail-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .detail-pill {
    border: 1.5px solid var(--paper-line);
    background: var(--panel);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-family: var(--sans);
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .detail-pill.active { border-color: var(--maroon); color: var(--maroon); }
  .detail-pill:disabled { opacity: 0.4; cursor: default; }
  .detail-chart-wrap { position: relative; height: 200px; margin-bottom: 14px; }
  .detail-history { display: flex; flex-direction: column; gap: 5px; font-size: 0.82rem; }
  .detail-history-row { display: flex; justify-content: space-between; color: var(--slate); }
  .detail-empty { color: var(--slate); font-size: 0.85rem; }

  .note {
    font-size: 0.78rem;
    color: var(--slate);
    margin-top: 10px;
    text-align: center;
  }

  @media (max-width: 760px) {
    .roster-head, .roster-row {
      grid-template-columns: 1.4fr repeat(6, 1fr) 0.8fr 0.7fr 24px;
      font-size: 0.72rem;
      overflow-x: auto;
    }
    .roster { overflow-x: auto; }
    .roster-head, .roster-row { min-width: 640px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
  "use strict";
  const ROSTER_KEY = "teacher_dashboard_roster_v1";
  const PERIODS = [1,2,3,4,5,6];
  const YEAR_LONG = new Set([1,2,3]);
  const GPA_AVERAGE = {"A":4.0,"A-":3.75,"B+":3.5,"B":3.0,"B-":2.75,"C+":2.5,"C":2.0,"F":0.0,"IE":null,"P":1.75};
  const GPA_CHART = {"A":4.0,"A-":3.75,"B+":3.5,"B":3.0,"B-":2.75,"C+":2.5,"C":2.0,"F":0.0,"IE":0.0,"P":null};
  const GPA_TICKS = [0, 2.0, 2.5, 2.75, 3.0, 3.5, 3.75, 4.0];
  const GPA_TICK_LABELS = {0:"F", 2.0:"C", 2.5:"C+", 2.75:"B-", 3.0:"B", 3.5:"B+", 3.75:"A-", 4.0:"A"};
  const CREDIT_WEIGHT = { 1: 0.5, 2: 0.5, 3: 0.25, 4: 1.0, 5: 1.0, 6: 1.0 };
  const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 567.57">
    <defs><style>.cls-1{fill:#822336;}.cls-2{fill:#fff;}.cls-3{fill:#d1d3d4;}</style></defs>
    <polygon class="cls-2" points="590 292.25 590 0 0 0 0 292.25 162.97 292.25 162.97 331.22 111.89 331.22 111.89 567.57 478.11 567.57 478.11 331.22 427.03 331.22 427.03 292.25 590 292.25"/>
    <polygon points="565 267.25 565 25 25 25 25 267.25 187.97 267.25 187.97 356.22 136.89 356.22 136.89 542.57 453.11 542.57 453.11 356.22 402.03 356.22 402.03 267.25 565 267.25"/>
    <polygon class="cls-3" points="535.81 239.29 535.81 52.95 54.19 52.95 54.19 239.29 190.41 239.29 190.41 183.39 217.16 183.39 217.16 384.18 166.08 384.18 166.08 514.61 423.92 514.61 423.92 384.18 372.84 384.18 372.84 183.39 399.6 183.39 399.6 239.29 535.81 239.29"/>
    <polygon class="cls-1" points="343.65 155.44 428.78 155.44 428.78 211.34 506.62 211.34 506.62 80.9 83.38 80.9 83.38 211.34 161.22 211.34 161.22 155.44 246.35 155.44 246.35 412.13 195.27 412.13 195.27 486.66 394.73 486.66 394.73 412.13 343.65 412.13 343.65 155.44"/>
  </svg>`;

  function emptyCourses(){
    const courses = {};
    PERIODS.forEach(p => {
      if (YEAR_LONG.has(p)) courses[p] = { name: "", grades: {1: [], 2: []} };
      else courses[p] = { names: {1: "", 2: ""}, grades: {1: [], 2: []} };
    });
    return courses;
  }

  function loadRoster(){
    try {
      const raw = localStorage.getItem(ROSTER_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === "object") ? parsed : {};
    } catch(e) { return {}; }
  }
  function saveRoster(){ try { localStorage.setItem(ROSTER_KEY, JSON.stringify(roster)); } catch(e) {} }

  let roster = loadRoster();
  let semester = 1;
  let activeFilter = "all";
  let searchText = "";
  let expandedKey = null;
  let expandedCourse = {};
  let detailChartInstance = null;

  function courseNameOf(student, period, sem){
    const c = student.courses[period];
    return YEAR_LONG.has(period) ? c.name : c.names[sem];
  }
  function gradesOf(student, period, sem){ return student.courses[period].grades[sem]; }
  function latestGradeOf(student, period, sem){
    const g = gradesOf(student, period, sem);
    return g.length ? g[g.length - 1] : null;
  }
  function computeGpaOf(student, sem){
    let weightedSum = 0, totalCredit = 0, includedCount = 0;
    PERIODS.forEach(p => {
      const latest = latestGradeOf(student, p, sem);
      if (!latest) return;
      const val = GPA_AVERAGE[latest.g];
      if (val === null || val === undefined) return;
      weightedSum += val * CREDIT_WEIGHT[p];
      totalCredit += CREDIT_WEIGHT[p];
      includedCount++;
    });
    return totalCredit > 0 ? weightedSum / totalCredit : null;
  }
  function countFOf(student, sem){
    return PERIODS.filter(p => {
      const l = latestGradeOf(student, p, sem);
      return l && l.g === "F";
    }).length;
  }
  function trendOf(student, sem){
    let pool = [];
    PERIODS.forEach(p => {
      gradesOf(student, p, sem).forEach(e => {
        const v = GPA_AVERAGE[e.g];
        if (v !== null && v !== undefined) pool.push({ t: e.t, v: v });
      });
    });
    pool.sort((a,b) => a.t - b.t);
    const recent = pool.slice(-4);
    if (recent.length < 2) return { dir: "none" };
    const n = recent.length;
    const xs = recent.map((_, i) => i);
    const meanX = xs.reduce((a,b) => a+b, 0) / n;
    const meanY = recent.reduce((a,b) => a+b.v, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) {
      num += (xs[i]-meanX) * (recent[i].v - meanY);
      den += (xs[i]-meanX) * (xs[i]-meanX);
    }
    const slope = den === 0 ? 0 : num/den;
    if (slope > 0.1) return { dir: "up", slope };
    if (slope < -0.1) return { dir: "down", slope };
    return { dir: "flat", slope };
  }

  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (inQuotes) {
        if (char === '"') {
          if (text[i+1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += char;
      } else {
        if (char === '"') inQuotes = true;
        else if (char === ',') { row.push(field); field = ""; }
        else if (char === '\r') { /* skip */ }
        else if (char === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
        else field += char;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function isSameDay(t1, t2){
    const d1 = new Date(t1), d2 = new Date(t2);
    return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
  }
  function collapseSameDay(entries){
    const result = [];
    entries.forEach(e => {
      if (result.length && isSameDay(result[result.length - 1].t, e.t)) {
        result[result.length - 1] = e;
      } else {
        result.push(e);
      }
    });
    return result;
  }

  async function handleImportFiles(fileList){
    const files = Array.from(fileList || []);
    if (!files.length) return;
    let importedCount = 0;
    const failedFiles = [];
    for (const file of files) {
      try {
        const text = await file.text();
        const table = parseCSV(text).filter(r => r.length && r.some(c => c.trim() !== ""));
        if (!table.length) { failedFiles.push(file.name); continue; }
        const header = table[0].map(h => h.trim().toLowerCase());
        const idx = {
          student: header.indexOf("student"),
          period: header.indexOf("period"),
          course: header.indexOf("course"),
          semester: header.indexOf("semester"),
          date: header.indexOf("date"),
          grade: header.indexOf("grade")
        };
        if (idx.period === -1 || idx.course === -1 || idx.semester === -1 || idx.date === -1 || idx.grade === -1) {
          failedFiles.push(file.name); continue;
        }
        const tempStudents = {};
        let anyRow = false;
        table.slice(1).forEach(r => {
          if (!r.length || r.every(c => c.trim() === "")) return;
          const period = parseInt(r[idx.period], 10);
          const sem = parseInt(r[idx.semester], 10);
          if (!PERIODS.includes(period) || (sem !== 1 && sem !== 2)) return;
          const rawName = idx.student > -1 ? (r[idx.student] || "").trim() : "";
          const fallback = file.name.replace(/\.csv$/i, "");
          const displayName = rawName || fallback;
          const key = displayName.toLowerCase();
          if (!tempStudents[key]) tempStudents[key] = { studentName: displayName, modifiedGrading: false, courses: emptyCourses() };
          const rec = tempStudents[key];
          const course = idx.course > -1 ? (r[idx.course] || "").trim() : "";
          const dateStr = (r[idx.date] || "").trim();
          const grade = (r[idx.grade] || "").trim();
          if (course) {
            if (YEAR_LONG.has(period)) rec.courses[period].name = course;
            else rec.courses[period].names[sem] = course;
          }
          if (dateStr && grade) {
            const t = Date.parse(dateStr);
            if (!isNaN(t)) {
              rec.courses[period].grades[sem].push({ t, g: grade });
              if (grade === "P") rec.modifiedGrading = true;
              anyRow = true;
            }
          }
        });
        if (!anyRow) { failedFiles.push(file.name); continue; }
        Object.keys(tempStudents).forEach(key => {
          const rec = tempStudents[key];
          PERIODS.forEach(p => {
            [1,2].forEach(s => {
              const sorted = rec.courses[p].grades[s].slice().sort((a,b) => a.t - b.t);
              rec.courses[p].grades[s] = collapseSameDay(sorted);
            });
          });
          roster[key] = rec;
          importedCount++;
        });
      } catch (e) {
        failedFiles.push(file.name);
      }
    }
    saveRoster();
    render();
    let msg = importedCount ? `Imported ${importedCount} student${importedCount === 1 ? "" : "s"}.` : "No students were imported.";
    if (failedFiles.length) msg += ` Could not read: ${failedFiles.join(", ")}.`;
    alert(msg);
  }

  function currentTheme(){
    const attr = document.documentElement.getAttribute("data-theme");
    if (attr === "light" || attr === "dark") return attr;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function setTheme(theme){
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("teacher_dashboard_theme_v1", theme); } catch(e) {}
  }
  const SUN_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5Z"/></svg>';

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }
  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
  }

  const app = document.getElementById("app");

  function render(){
    app.innerHTML = "";

    const header = document.createElement("header");
    header.className = "top";
    const studentKeys = Object.keys(roster);
    header.innerHTML = `
      <div class="brand">
        <div class="logo-plate">${LOGO_SVG}</div>
        <div>
          <h1>Teacher Dashboard</h1>
          <div class="sub">${studentKeys.length} student${studentKeys.length === 1 ? "" : "s"} imported &middot; Semester ${semester}</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="sem-toggle" id="semToggle">
          <button data-sem="1" class="${semester===1?'active':''}">Semester 1</button>
          <button data-sem="2" class="${semester===2?'active':''}">Semester 2</button>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Switch to ${currentTheme()==='dark' ? 'light' : 'dark'} mode" aria-label="Toggle light/dark theme">${currentTheme()==='dark' ? SUN_ICON : MOON_ICON}</button>
      </div>
    `;
    app.appendChild(header);
    header.querySelector("#semToggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      semester = parseInt(btn.dataset.sem, 10);
      render();
    });
    header.querySelector("#themeToggle").addEventListener("click", () => {
      setTheme(currentTheme() === "dark" ? "light" : "dark");
      render();
    });

    const toolbar = document.createElement("div");
    toolbar.className = "toolbar";
    toolbar.innerHTML = `
      <button class="btn primary" id="importBtn">Import CSVs</button>
      <input type="file" accept=".csv" multiple id="importFile" style="display:none">
      <input type="text" class="search-input" id="searchInput" placeholder="Search student name" value="${escapeHtml(searchText)}">
      <button class="btn ghost" id="clearAllBtn">Clear all data</button>
    `;
    app.appendChild(toolbar);
    toolbar.querySelector("#importBtn").addEventListener("click", () => toolbar.querySelector("#importFile").click());
    toolbar.querySelector("#importFile").addEventListener("change", (e) => {
      handleImportFiles(e.target.files);
      e.target.value = "";
    });
    toolbar.querySelector("#searchInput").addEventListener("input", (e) => {
      searchText = e.target.value;
      renderRosterOnly();
    });
    toolbar.querySelector("#clearAllBtn").addEventListener("click", () => {
      if (studentKeys.length && confirm("This clears every imported student's data from this device. Continue?")) {
        roster = {};
        saveRoster();
        expandedKey = null;
        render();
      }
    });

    if (!studentKeys.length) {
      toolbar.querySelector("#searchInput").disabled = true;
      toolbar.querySelector("#clearAllBtn").disabled = true;
    }

    // Stat cards
    const statsWrap = document.createElement("div");
    statsWrap.id = "statsWrap";
    app.appendChild(statsWrap);

    // Filter chips
    const chipsWrap = document.createElement("div");
    chipsWrap.className = "filter-chips";
    const FILTERS = [
      { id: "all", label: "All students" },
      { id: "hasF", label: "Has 1+ F" },
      { id: "hasF2", label: "Has 2+ F" },
      { id: "gpa3", label: "GPA 3.0+" },
      { id: "down", label: "Trending down" },
      { id: "up", label: "Trending up" }
    ];
    FILTERS.forEach(f => {
      const chip = document.createElement("button");
      chip.className = "chip" + (activeFilter === f.id ? " active" : "");
      chip.textContent = f.label;
      chip.addEventListener("click", () => { activeFilter = f.id; render(); });
      chipsWrap.appendChild(chip);
    });
    app.appendChild(chipsWrap);

    // Roster
    const rosterWrap = document.createElement("div");
    rosterWrap.id = "rosterWrap";
    app.appendChild(rosterWrap);

    const note = document.createElement("div");
    note.className = "note";
    note.textContent = "Click any student to see their full course history and chart. All data stays in this browser.";
    app.appendChild(note);

    renderRosterOnly();

    function renderRosterOnly(){
      const allKeys = Object.keys(roster);
      const computed = allKeys.map(key => {
        const student = roster[key];
        const fCount = countFOf(student, semester);
        return {
          key,
          student,
          gpa: computeGpaOf(student, semester),
          fCount,
          hasF: fCount >= 1,
          hasF2: fCount >= 2,
          trend: trendOf(student, semester)
        };
      });

      statsWrap.className = "stat-cards";
      const total = computed.length;
      const fCount = computed.filter(c => c.hasF).length;
      const downCount = computed.filter(c => c.trend.dir === "down").length;
      const upCount = computed.filter(c => c.trend.dir === "up").length;
      statsWrap.innerHTML = `
        <div class="stat-card"><div class="num">${total}</div><div class="label">Students</div></div>
        <div class="stat-card danger"><div class="num">${fCount}</div><div class="label">Have 1+ F</div></div>
        <div class="stat-card danger"><div class="num">${downCount}</div><div class="label">Trending down</div></div>
        <div class="stat-card success"><div class="num">${upCount}</div><div class="label">Trending up</div></div>
      `;

      let filtered = computed;
      if (activeFilter === "hasF") filtered = filtered.filter(c => c.hasF);
      else if (activeFilter === "hasF2") filtered = filtered.filter(c => c.hasF2);
      else if (activeFilter === "gpa3") filtered = filtered.filter(c => c.gpa !== null && c.gpa >= 3.0);
      else if (activeFilter === "down") filtered = filtered.filter(c => c.trend.dir === "down");
      else if (activeFilter === "up") filtered = filtered.filter(c => c.trend.dir === "up");
      if (searchText.trim()) {
        const q = searchText.trim().toLowerCase();
        filtered = filtered.filter(c => c.student.studentName.toLowerCase().includes(q));
      }
      filtered.sort((a,b) => a.student.studentName.localeCompare(b.student.studentName));

      rosterWrap.innerHTML = "";
      if (!allKeys.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = `
          <div>No students imported yet.</div>
          <div style="font-size:0.82rem;margin-top:4px;">Import the CSV files students exported from their Gradebook Tracker to get started.</div>
        `;
        const importBtn2 = document.createElement("button");
        importBtn2.className = "btn primary";
        importBtn2.textContent = "Import CSVs";
        importBtn2.addEventListener("click", () => toolbar.querySelector("#importFile").click());
        empty.appendChild(importBtn2);
        rosterWrap.appendChild(empty);
        return;
      }
      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No students match this filter.";
        rosterWrap.appendChild(empty);
        return;
      }

      const rosterEl = document.createElement("div");
      rosterEl.className = "roster";
      const head = document.createElement("div");
      head.className = "roster-head";
      head.innerHTML = `<span>Student</span>` + PERIODS.map(p => `<span>P${p}</span>`).join("") + `<span>GPA</span><span>Trend</span><span></span>`;
      rosterEl.appendChild(head);

      filtered.forEach(c => {
        const row = document.createElement("div");
        row.className = "roster-row";
        const gradeCells = PERIODS.map(p => {
          const latest = latestGradeOf(c.student, p, semester);
          if (!latest) return `<span class="grade-none">&mdash;</span>`;
          if (latest.g === "F") return `<span class="grade-f">F</span>`;
          if (latest.g === "IE") return `<span class="grade-ie">IE</span>`;
          return `<span>${escapeHtml(latest.g)}</span>`;
        }).join("");
        const trendIcon = c.trend.dir === "up" ? '<span class="trend-up">&uarr;</span>'
          : c.trend.dir === "down" ? '<span class="trend-down">&darr;</span>'
          : c.trend.dir === "flat" ? '<span class="trend-flat">&rarr;</span>'
          : '<span class="trend-flat">&mdash;</span>';
        row.innerHTML = `
          <span class="rname">${escapeHtml(c.student.studentName)}</span>
          ${gradeCells}
          <span>${c.gpa === null ? "&mdash;" : c.gpa.toFixed(2)}</span>
          <span>${trendIcon}</span>
          <button class="remove-student" data-key="${escapeHtml(c.key)}" title="Remove student">&times;</button>
        `;
        row.addEventListener("click", (e) => {
          if (e.target.closest(".remove-student")) return;
          expandedKey = (expandedKey === c.key) ? null : c.key;
          if (!expandedCourse[c.key]) {
            const firstWithData = PERIODS.find(p => courseNameOf(c.student, p, semester));
            expandedCourse[c.key] = firstWithData || 1;
          }
          renderRosterOnly();
        });
        rosterEl.appendChild(row);

        row.querySelector(".remove-student").addEventListener("click", (e) => {
          e.stopPropagation();
          if (confirm(`Remove ${c.student.studentName} from this dashboard?`)) {
            delete roster[c.key];
            saveRoster();
            if (expandedKey === c.key) expandedKey = null;
            render();
          }
        });

        if (expandedKey === c.key) {
          const detail = document.createElement("div");
          detail.className = "detail-panel";
          const pills = document.createElement("div");
          pills.className = "detail-pills";
          PERIODS.forEach(p => {
            const name = courseNameOf(c.student, p, semester);
            const pill = document.createElement("button");
            pill.className = "detail-pill" + (expandedCourse[c.key] === p ? " active" : "");
            pill.textContent = `P${p}${name ? " · " + name : ""}`;
            pill.disabled = !name;
            pill.addEventListener("click", () => {
              expandedCourse[c.key] = p;
              renderRosterOnly();
            });
            pills.appendChild(pill);
          });
          detail.appendChild(pills);

          const dp = expandedCourse[c.key];
          const entries = gradesOf(c.student, dp, semester);
          if (!entries.length) {
            const emptyDetail = document.createElement("div");
            emptyDetail.className = "detail-empty";
            emptyDetail.textContent = "No grades logged for this course yet.";
            detail.appendChild(emptyDetail);
          } else {
            const chartWrap = document.createElement("div");
            chartWrap.className = "detail-chart-wrap";
            const canvas = document.createElement("canvas");
            chartWrap.appendChild(canvas);
            detail.appendChild(chartWrap);

            const historyWrap = document.createElement("div");
            historyWrap.className = "detail-history";
            entries.slice().reverse().forEach(entry => {
              const r = document.createElement("div");
              r.className = "detail-history-row";
              r.innerHTML = `<span>${fmtDate(entry.t)}</span><span>${escapeHtml(entry.g)}</span>`;
              historyWrap.appendChild(r);
            });
            detail.appendChild(historyWrap);

            requestAnimationFrame(() => {
              if (detailChartInstance) { detailChartInstance.destroy(); detailChartInstance = null; }
              const styles = getComputedStyle(document.documentElement);
              const maroon = styles.getPropertyValue("--maroon").trim();
              const ink = styles.getPropertyValue("--ink").trim();
              const gridColor = styles.getPropertyValue("--paper-line").trim();
              const sorted = entries.slice().sort((a,b) => a.t - b.t);
              detailChartInstance = new Chart(canvas.getContext("2d"), {
                type: "line",
                data: {
                  labels: sorted.map(e => fmtDate(e.t)),
                  datasets: [{
                    data: sorted.map(e => GPA_CHART[e.g]),
                    borderColor: maroon,
                    backgroundColor: maroon,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    tension: 0.25,
                    fill: false
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  layout: { padding: { left: 8, right: 8, top: 6, bottom: 0 } },
                  plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: (ctx) => sorted[ctx.dataIndex].g } }
                  },
                  scales: {
                    y: {
                      min: 0, max: 4,
                      afterBuildTicks: (axis) => { axis.ticks = GPA_TICKS.map(v => ({ value: v })); },
                      ticks: { color: ink, padding: 10, crossAlign: "far", callback: (val) => GPA_TICK_LABELS[val] !== undefined ? GPA_TICK_LABELS[val] : "" },
                      grid: { color: gridColor }
                    },
                    x: { ticks: { color: ink, maxRotation: 0, autoSkip: true }, grid: { display: false } }
                  }
                }
              });
            });
          }
          rosterEl.appendChild(detail);
        }
      });

      rosterWrap.appendChild(rosterEl);
    }
  }

  render();
})();
</script>
</body>
</html>
